name: Publicar la web

# Al cambiar la edición, el programa o los artistas (desde el portal o a mano) o los scripts,
# regenera las páginas y las sube; Cloudflare publica solo al recibir el commit.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [data/**, scripts/generar.py, img/artistas/**]

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar las páginas
        run: python3 scripts/generar.py
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A *.html sitemap.xml robots.txt site.webmanifest
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Web regenerada con los datos actuales"
          git pull --rebase origin main
          git push
