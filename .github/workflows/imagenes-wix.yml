name: Traer imágenes de Wix

# Se ejecuta sola la primera vez que se sube scripts/imagenes.py,
# o a mano desde la pestaña Actions > "Traer imágenes de Wix" > Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/imagenes.py]

permissions:
  contents: write

jobs:
  imagenes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python3 scripts/imagenes.py
      - name: Guardar las imágenes en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add img *.png favicon.ico
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Imágenes migradas desde Wix en WebP"
          git push
